[package]
name = "lau-geometric-deep-learning"
version = "0.1.0"
edition = "2021"
description = "Geometric Deep Learning framework — 5 symmetries applied to agent systems"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-geometric-deep-learning"
keywords = ["geometric-deep-learning", "equivariance", "graph-neural-networks", "spectral-filters"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "lau_geometric_deep_learning"
path = "src/lib.rs"
